<h2 mat-dialog-title>Logged in user info</h2>

<mat-dialog-content>
  @if (user(); as userData) {
    <div class="logged-user__info">
      <div class="logged-user__info-row">
        <span class="logged-user__info-label">Username:</span>
        <span class="logged-user__info-value">{{ userData.username }}</span>
      </div>
      <div class="logged-user__info-row">
        <span class="logged-user__info-label">Account type:</span>
        <span class="logged-user__info-value">
          {{ userData.auth_source === 'ldap' ? 'Directory account (LDAP / Active Directory)' : 'Local account' }}
        </span>
      </div>
      <div class="logged-user__info-row">
        <span class="logged-user__info-label">Full name:</span>
        <span class="logged-user__info-value">{{ userData.full_name }}</span>
      </div>
      <div class="logged-user__info-row">
        <span class="logged-user__info-label">Email:</span>
        <span class="logged-user__info-value">{{ userData.email }}</span>
      </div>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions class="logged-user__actions" align="end">
  <span
    [matTooltip]="
      user()?.auth_source === 'ldap'
        ? 'Password is managed by your organization\'s directory (LDAP/Active Directory)'
        : ''
    "
    matTooltipPosition="above"
  >
    <button
      mat-raised-button
      color="primary"
      [disabled]="user()?.auth_source === 'ldap'"
      (click)="changePassword()"
    >
      Change password
    </button>
  </span>
  <button mat-raised-button color="primary" (click)="copyToken()">Copy access token</button>
  <button mat-button (click)="close()">Close</button>
</mat-dialog-actions>
